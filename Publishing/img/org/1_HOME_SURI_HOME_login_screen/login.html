<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOME SURI HOME - 로그인</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="login.css">
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
<script src="common.js" defer></script>
<script src="login.js" defer></script>
</head>
<body>
<div class="app-shell">
<main class="login-main">
    <div class="brand-visual">
        <img src="../../img/3_004.png" alt="HOME SURI HOME 로고">
    </div>
    <div class="character-visual">
        <img src="../../img/1_004.png"
             alt="망치를 들고 집을 수리하는 비버 캐릭터">
    </div><section class="login-copy"><h1>사진 한 장으로, <em>집수리가 쉬워집니다.</em></h1><p>AI가 문제를 분석하고, 해결 방법을 알려드려요.</p></section>
<section class="login-card">
<form id="loginForm" novalidate>
<div class="field-group"><label class="field-label" for="email">이메일</label><div class="field-wrap"><i data-lucide="mail"></i><input id="email" type="email" autocomplete="email" placeholder="example@homesuri.com"></div></div>
<div class="field-group">
    <label class="field-label" for="password">비밀번호</label>
  
    <div class="field-wrap">
      <i data-lucide="lock-keyhole"></i>
  
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="••••••••"
      >
  
      <button
        class="password-toggle"
        id="passwordToggle"
        type="button"
        aria-label="비밀번호 표시"
      >
        <i data-lucide="eye-off"></i>
      </button>
    </div>
  </div>

<button class="login-button" type="submit">로그인</button>
<div class="divider"><span>간편 로그인</span></div>
<button class="google-button" id="googleLogin" type="button">
    <img class="google-logo" src="../../img/2_004.png" alt="Google">
    <span>Google로 계속하기</span>
</button>
<div class="account-links"><a href="#" data-placeholder-link>아이디/비밀번호 찾기</a><a href="#" data-placeholder-link>회원가입</a></div>
</form>
</section>
<p class="customer-link">도움이 필요하신가요? <a href="#" data-placeholder-link>고객센터 문의하기</a></p>
</main>
<nav class="bottom-nav" aria-label="하단 메뉴">
<button class="nav-item active" type="button"><i data-lucide="house"></i><span>홈</span></button>
<button class="nav-item" type="button"><i data-lucide="scan-line"></i><span>AI 스캔</span></button>
<button class="nav-item" type="button"><i data-lucide="shopping-cart"></i><span>구매</span></button>
<button class="nav-item" type="button"><i data-lucide="message-square"></i><span>커뮤니티</span></button>
<button class="nav-item" type="button"><i data-lucide="user-round"></i><span>마이페이지</span></button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
</body>
</html>
