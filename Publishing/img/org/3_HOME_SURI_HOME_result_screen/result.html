<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOME SURI HOME - 분석 결과</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="result.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="data.js" defer></script>
  <script src="common.js" defer></script>
  <script src="result.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="HOME SURI HOME 홈">
        <i data-lucide="house"></i><span>HOME SURI HOME</span>
      </a>
      <div class="top-actions">
        <button class="icon-button" type="button" aria-label="검색"><i data-lucide="search"></i></button>
        <button class="icon-button" type="button" aria-label="알림"><i data-lucide="bell"></i></button>
      </div>
    </header>

    <main class="result-main">
      <section class="result-hero" aria-labelledby="resultTitle">
        <img class="result-beaver" src="../../img/1_002.png" alt="망치를 들고 있는 비버 캐릭터">
        <h1 id="resultTitle">분석 결과 요약</h1>
        <p class="issue-title" id="issueTitle"></p>
        <span class="confidence-pill" id="confidencePill"></span>
      </section>

      <section class="summary-grid" id="summaryGrid" aria-label="분석 요약"></section>

      <section class="warning-card">
        <h2><i data-lucide="triangle-alert"></i> 작업 전 주의사항</h2>
        <ul id="cautionList"></ul>
      </section>

      <section class="section-block">
        <h2>필요한 공구 및 부품</h2>
        <div class="tool-grid" id="toolGrid"></div>
        <article class="part-card" id="partCard"></article>
      </section>

      <section class="section-block">
        <div class="section-heading-row">
          <h2>단계별 수리 가이드</h2>
          <span id="stepCount"></span>
        </div>
        <div class="step-list" id="stepList"></div>
      </section>

      <section class="checklist-card">
        <h2><i data-lucide="list-checks"></i> 최종 체크리스트</h2>
        <div id="checklist"></div>
      </section>

      <button class="expert-link" type="button" id="expertBtn">
        <i data-lucide="users"></i> 전문가에게 맡기기
      </button>

      <button class="complete-button" type="button" id="completeBtn">
        <i data-lucide="circle-check"></i> 수리 완료
      </button>
    </main>

    <nav class="bottom-nav" aria-label="하단 메뉴">
      <button class="nav-item" type="button"><i data-lucide="house"></i><span>홈</span></button>
      <button class="nav-item active" type="button"><i data-lucide="scan-line"></i><span>AI 스캔</span></button>
      <button class="nav-item" type="button"><i data-lucide="shopping-bag"></i><span>상점</span></button>
      <button class="nav-item" type="button"><i data-lucide="users"></i><span>커뮤니티</span></button>
      <button class="nav-item" type="button"><i data-lucide="user-round"></i><span>내 정보</span></button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
