<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HOME SURI HOME - 수리 완료</title>

  <link rel="stylesheet" href="complete-modal.css">

  <script
    src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"
    defer
  ></script>

  <script src="complete-modal.js" defer></script>
</head>

<body>
  <main class="demo-page">
    <button
      class="open-modal-button"
      id="openCompleteModal"
      type="button"
    >
      수리 완료 팝업 열기
    </button>
  </main>

  <div
    class="modal-overlay"
    id="completeModal"
    hidden
  >
    <section
      class="complete-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="completeModalTitle"
      aria-describedby="completeModalDescription"
    >
      <div class="modal-handle" aria-hidden="true"></div>

      <img
        class="complete-beaver"
        src="../img/1_1_003.png"
        alt="수리 완료를 축하하는 비버 캐릭터"
      >

      <header class="modal-copy">
        <h2 id="completeModalTitle">
          🎉 축하해요!<br>
          오늘의 집수리를 완료했어요!
        </h2>

        <p id="completeModalDescription">
          비버 덕분에 또 하나의 문제를 해결했어요!<br>
          여러분의 경험을 공유하면 다른 사용자에게도<br>
          큰 도움이 됩니다.
        </p>
      </header>

      <section class="benefit-card" aria-label="후기 작성 혜택">
        <div class="benefit-row">
          <i data-lucide="star"></i>
          <span>후기 작성 시 +20 포인트 지급</span>
        </div>

        <div class="benefit-row">
          <i data-lucide="trophy"></i>
          <span>집수리 경험 공유</span>
        </div>

        <div class="benefit-row">
          <i data-lucide="message-circle"></i>
          <span>다른 사용자에게 도움 주기</span>
        </div>
      </section>

      <div class="modal-actions">
        <button
          class="later-button"
          id="laterButton"
          type="button"
        >
          나중에 할게요
        </button>

        <button
          class="review-button"
          id="reviewButton"
          type="button"
        >
          후기 작성하기
        </button>
      </div>
    </section>
  </div>

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>
</body>

</html>
