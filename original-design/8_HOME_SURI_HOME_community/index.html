<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HOME SURI HOME - 커뮤니티</title>

  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="community.css">

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="data.js" defer></script>
  <script src="common.js" defer></script>
  <script src="community.js" defer></script>
</head>

<body>
  <div class="app-shell">

    <header class="topbar">
      <a class="brand" href="#" aria-label="HOME SURI HOME 홈">
        <i data-lucide="house"></i>
        <span>HOME SURI HOME</span>
      </a>

      <div class="top-actions">
        <button class="icon-button" type="button" aria-label="검색">
          <i data-lucide="search"></i>
        </button>

        <button class="icon-button" type="button" aria-label="알림">
          <i data-lucide="bell"></i>
        </button>
      </div>
    </header>

    <main class="community-main">

      <section class="community-switch" aria-label="커뮤니티 메뉴">
        <button class="switch-button active" type="button">커뮤니티</button>
        <button class="switch-button" type="button">마이페이지</button>
      </section>

      <section class="filter-row" aria-label="게시글 필터">
        <button class="filter-button active" type="button">인기</button>
        <button class="filter-button" type="button">최신</button>
        <button class="filter-button ai" type="button">✦ AI 추천</button>
      </section>

      <article class="featured-post" id="featuredPost"></article>

      <section class="section-block">
        <h2>✦ AI 맞춤 유사 게시글</h2>
        <div class="similar-posts" id="similarPosts"></div>
      </section>

      <section class="review-banner" id="reviewBanner"></section>

    </main>

    <nav class="bottom-nav" aria-label="하단 메뉴">
      <button class="nav-item" type="button">
        <i data-lucide="house"></i>
        <span>홈</span>
      </button>

      <button class="nav-item" type="button">
        <i data-lucide="camera"></i>
        <span>AI 스캔</span>
      </button>

      <button class="nav-item" type="button">
        <i data-lucide="shopping-cart"></i>
        <span>상점</span>
      </button>

      <button class="nav-item active" type="button">
        <i data-lucide="users"></i>
        <span>커뮤니티</span>
      </button>

      <button class="nav-item" type="button">
        <i data-lucide="user-round"></i>
        <span>마이페이지</span>
      </button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</body>

</html>
